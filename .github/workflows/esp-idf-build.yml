name: ESP-IDF Build

on:
  push:
    branches:
      - stage-03-midi-program-change
      - stage-04-ui-modes-stomp
      - stage-05-hardware-v2
      - stage-06-live-mapper
      - stage-07-full-dynamic-editor
      - stage-08-synth-mode
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-S3 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          path: .
